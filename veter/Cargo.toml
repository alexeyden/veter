[package]
name = "veter"
version = "0.1.0"
edition = "2024"

# Hybrid lib+bin: the lib face exposes the host engine modules
# (vge, prt, vft) and their dependencies so other workspace crates —
# notably `vsd` (`doc/session-manager.md`) — can link against the
# same engine state without re-implementing it. The `[[bin]]` target
# is the GUI veter binary itself.
[lib]
name = "veter"
path = "src/lib.rs"

[[bin]]
name = "veter"
path = "src/main.rs"

[dependencies]
veter-host = { path = "../libs/veter-host" }
vge-protocol = { path = "../protocol/vge" }
prt-protocol = { path = "../protocol/prt" }
vft-protocol = { path = "../protocol/vft" }
vt100 = { path = "../vendored/vt100" }
femtovg = { path = "../vendored/femtovg", features = ["swash"] }
parley = "0.7"
swash = "0.2"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
libc = "0.2"
rgb = "0.8"
imgref = "1"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
# `image-data` backs copying a VGE raster image to the clipboard
# (`vector-graphics-extension.md` §14); it re-encodes the RGBA we hand
# it as PNG for the X11 / Wayland offer.
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
# Backing for `vft::RendererHooks` — the native file dialog VFT
# opens for a deferred-form transfer (§7.1) and the launcher that
# hands a finished download to the user's default app (§6.1).
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
opener = "0.8"
memchr = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
