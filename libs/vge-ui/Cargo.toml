[package]
name = "vge-ui"
version = "0.1.0"
edition = "2024"
description = "Shared client-side widget toolkit for VGE-aware terminal apps: accent theme, chrome paths, line editor, filterable picker, modal builders, key/mouse input parsing."

[dependencies]
vge-protocol = { path = "../../protocol/vge" }
prt-protocol = { path = "../../protocol/prt" }
unicode-width = "0.2.1"

[features]
# A private Frutiger Aero style shared by vmux and vfm (`src/aero.rs`).
# Off here; each client's own `aero` feature turns it on. Not for release.
aero = []
