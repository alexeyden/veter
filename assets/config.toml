# Veter configuration.
#
# Location: $XDG_CONFIG_HOME/veter/config.toml
#           (falls back to ~/.config/veter/config.toml)
#
# Every setting is optional. Anything left commented keeps its built-in
# default — the value shown after each `#` below. A malformed value or a
# broken key chord logs one line to stderr and falls back to the default
# for just that setting, so a typo never stops veter from starting.
#
# Colors are hex strings: "#rrggbb" or "#rrggbbaa".
# Key chords are "Mod+Mod+Key", e.g. "Ctrl+Shift+C", "Alt+I", "Shift+PageUp".
#   Modifiers:  Ctrl, Shift, Alt.
#   Named keys: Space, Enter, Escape, Backspace, Tab, PageUp, PageDown,
#               Home, End, Delete, Insert, Up, Down, Left, Right, F1..F12.
#   A single character is written literally ("/", "n"); for a key with no
#   Ctrl/Alt its case matters ("n" vs "N").

# ---------------------------------------------------------------------------
# Colour theme
# ---------------------------------------------------------------------------
# One name sets the whole look: the 16 ANSI colours, the terminal's default
# fore/background and cursor, the accents veter publishes to in-terminal
# tools, and its own overlay chrome (the search panel, the close prompt).
#
# Built-in names:
#
#   veter              the default — the Tango grid and muted blue/olive/violet
#                      accents veter has always used
#   tokyonight-storm   folke/tokyonight.nvim, storm variant
#   catppuccin-mocha   catppuccin, mocha flavour
#   gruvbox-dark       morhetz/gruvbox, dark medium
#   nord               nordtheme/nord
#
# A name that is not one of those is looked up as
# $XDG_CONFIG_HOME/veter/themes/<name>.toml — same schema as the keys below,
# merged onto the default, so any published scheme can be dropped in without
# a rebuild. A file only has to give `ansi`, `background` and `foreground`;
# everything else is derived from those unless it is named.
#
# Any key below overrides the named theme's own value.
[theme]
# name = "tokyonight-storm"
#
# The grid. `ansi` is the 16-entry ANSI table in terminfo order — the eight
# normal colours, then the eight bright ones. Indices 16-255 are the standard
# colour cube and greyscale ramp and are not configurable.
# ansi = [
#   "#000000", "#cc0000", "#4e9a06", "#c4a000",   # black red green yellow
#   "#3465a4", "#75507b", "#06989a", "#d3d7cf",   # blue magenta cyan white
#   "#555753", "#ef2929", "#8ae234", "#fce94f",   # bright …
#   "#729fcf", "#ad7fa8", "#34e2e2", "#eeeeec",
# ]
# background = "#1e1e1e"
# foreground = "#cccccc"
#
# The accents. Published into the reserved `host.*` VGE style namespace, where
# vmux and the other in-terminal tools draw their chrome (pane outlines, tabs,
# titles) from them: slot 1 is `host.accent.1`, and the contextual
# `host.accent` rotates through the list by portal nesting depth. Any length
# >= 1; unset, blue/green/magenta are taken from `ansi`.
#
# They are a field of the theme rather than a section of their own because
# `text_on_accent` and the search-panel tint are *derived from* the accent —
# set a dark one and text over it turns light to match.
#
# The eight non-accent `host.*` colours (the terminal's ground, its text, the
# surfaces a modal is built from) come from the keys below and from
# `background`/`foreground`; they describe the terminal, so there is nothing
# per-client to set.
# accents = ["#56799f", "#859f3d", "#5a3c9e"]   # muted blue / olive / violet
#
# `cursor` and the selection pair are optional. Unset, both keep veter's
# built-in look: the cell drawn in reverse video. Setting only `selection_bg`
# fills behind the selected cell and leaves each character its own colour.
# cursor       = "#cccccc"
# selection_bg = "#264f78"
# selection_fg = "#ffffff"
#
# Chrome. Unset, each is derived from the three required values above —
# what a dropped-in scheme file relies on. Pin one to take it as given.
# surface        = "#26262a"   # overlay panel fill
# surface_inset  = "#1a1a1e"   # a recessed surface inside a panel
# text           = "#ebebeb"   # primary text on `surface`
# text_dim       = "#9a9a9a"   # key hints, inactive labels
# text_on_accent = "#f5f5f5"   # text over an accent fill
# warn_fill      = "#34282a"   # the Quit button, the `no matches` chip
# warn_border    = "#964646"
# warn_text      = "#e88282"

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
# `family` is the primary face, resolved by Fontconfig — a real family name
# or one of the generic aliases. `fallback` lists families tried in order for
# a character the primary lacks, ahead of any generic lookup.
#
# The fallback list matters most for icon glyphs (Nerd Font symbols), which
# live in the Private Use Area. Nothing about a PUA codepoint says which
# symbol it is, so a font mapping one is not evidence it draws the intended
# glyph: Adwaita Sans, the GNOME UI font, spends 745 PUA codepoints on its own
# stylistic alternates — U+E0A0, the powerline branch, is its `divide.case`.
#
# So for a PUA character no listed family covers, veter asks Fontconfig which
# font actually owns the codepoint (an ordered charset match, the same way
# Konsole resolves it) rather than taking the first family that claims it.
# That is usually the better answer, which is why the list is empty by
# default: Fontconfig tends to name a patched monospace font, already
# proportioned like the primary, while a standalone symbol face advances a
# full em per glyph and has to be scaled down to fit the cell. Name one here
# only to pin a particular face; missing families are skipped silently.
#
# Powerline separators (U+E0B0..U+E0B7) don't go through any of this — they
# are drawn as cell-sized primitives, like the box and block elements, so
# they tile seamlessly whatever is installed, including nothing.
[font]
# family = "monospace"
# fallback = ["Symbols Nerd Font Mono"]

# ---------------------------------------------------------------------------
# Search chrome colors
# ---------------------------------------------------------------------------
# Every key is optional and overrides the theme's own value, so a theme
# change restyles the panel unless you pin something here.
[search]
# accent        = "#56799f"   # search-panel chrome: border, caret, chip fills
#                             # (default: accent slot 1, so the panel follows
#                             # the palette above). The old name `bar_bg`
#                             # still works.
# bar_text      = "#e6e6e6"   # query text in the search panel
# current_match = "#dca000"   # the active match (the one n/N navigates to)
# match         = "#50501e"   # all other matches

# ---------------------------------------------------------------------------
# Host key chords (intercepted before the terminal forwards keys to the shell)
# ---------------------------------------------------------------------------
[keys]
# open_search      = "/"                 # open search (only while scrolled back)
# open_overlay     = "Ctrl+Shift+Space"  # open the scrollback/search overlay
# open_hints       = "Ctrl+Shift+F"      # open the overlay in hint mode
# scroll_page_up   = "Shift+PageUp"
# scroll_page_down = "Shift+PageDown"
# copy             = "Ctrl+Shift+C"
# paste            = "Ctrl+Shift+V"

# In-overlay keys.
[keys.search]
# close       = "Escape"
# next_match  = "n"
# prev_match  = "N"
# toggle_case = "Alt+C"
# page_up     = "PageUp"
# page_down   = "PageDown"
# toggle_hints = "Tab"   # switch between typed-query search and hints.
#                        # Keep this a non-printable chord: a plain letter
#                        # would shadow a hint label / a query character.

# ---------------------------------------------------------------------------
# Hint mode
# ---------------------------------------------------------------------------
# Ctrl+Shift+F labels every URL, path, hash and so on already on screen — no
# query to type. Press a label to select exactly that text; the overlay closes
# leaving the selection fresh, so a `[[selection_commands]]` key below acts on
# it straight away. Paging (PageUp/PageDown) re-labels what is on screen; any
# key that isn't a label closes the overlay.
#
# Detectors, and what each one recognises:
#
#   url     http(s)/ftp/file/ssh/git/… schemes and bare `www.` hosts. Trailing
#           sentence punctuation is trimmed and parens are balanced, so
#           `(see https://x/Foo_(bar))` yields the link and not the `)`.
#   email   user@host.tld
#   uuid    8-4-4-4-12 hex
#   ip      IPv4, with an optional `:port`
#   path    anything containing a `/` (plus `~/…`), keeping a trailing
#           `:line[:col]` — so a grep or rustc location comes back whole.
#   file    a bare `name.ext` with no slash — `Cargo.toml`, `README.md`,
#           `main.rs:42` — plus dotfiles like `.gitignore`. The extension
#           must be one veter knows (see extra_file_extensions below): a
#           plain `{name}.{ext}` shape cannot tell `main.rs` from
#           `self.name`, so a screenful of source would otherwise label
#           every field access on it.
#   hash    7–64 lowercase hex digits: git revisions, docker ids, sha sums.
#   color   #rgb / #rgba / #rrggbb / #rrggbbaa
#
# `kinds` is both the enable list and the priority order — when two detectors
# claim overlapping text, the one listed first wins. Drop a name to switch that
# detector off. A URL that wraps across the right margin is detected whole.
[hints]
# kinds = ["url", "email", "uuid", "ip", "path", "file", "hash", "color"]
#
# Extensions the `file` detector should accept on top of its built-in list
# (source, config, documents, images, audio/video, archives, build output,
# fonts). Leading dot optional, case-insensitive.
# extra_file_extensions = [".myext", "dat"]

# ---------------------------------------------------------------------------
# Selection commands
# ---------------------------------------------------------------------------
# Act on the selected text. While a *fresh* selection is active — one you just
# made, before typing anything else in the shell — the bound key fires the
# action instead of going to the shell. The first normal key you type disarms
# it, so a lingering highlight never hijacks your typing.
#
# Each entry has a `key` and exactly one of:
#
#   command = '…'   Run it via `$SHELL -c` (detached), with the selected text
#                   available as $VETER_SELECTION and as the positional $1.
#
#   input   = "…"   Type the text back into the terminal, as if you had typed
#                   it yourself. `%` is replaced by the selection, `%q` by the
#                   shell-quoted selection, `%k` by the hint kind, `%%` by a
#                   literal `%`. Use a double-quoted TOML string so `\n` is a
#                   real newline — that is what presses Enter.
#
# When the selection came from a hint label (see [hints] above), what it was
# recognised as is exported as $VETER_HINT_KIND — "url", "path", "hash", … —
# and is empty for a selection made any other way. That is what lets one key
# do the right thing for both: see the `o` example below.
#
# Bare letters are case-sensitive: "o" is the o key, "O" is Shift+o. Chords
# with modifiers work too (e.g. "Ctrl+O"). There are no defaults — nothing
# runs unless you add entries here.
#
# [[selection_commands]]
# key = "o"                                  # open a path/URL with the default app
# command = 'xdg-open "$VETER_SELECTION"'
#
# The same key, branching on what hint mode recognised: edit a file, open
# everything else. `path` and `file` hints keep their `:line:col` suffix,
# which is exactly what `$EDITOR +line file` wants — hence the split.
# [[selection_commands]]
# key = "o"
# description = "open URLs, edit paths"
# command = '''
# case "$VETER_HINT_KIND" in
#   path|file) f=${1%%:*}; rest=${1#"$f"}; l=${rest#:}; l=${l%%:*}
#              "${VETER_EXE:-veter}" -e "${EDITOR:-vim}" ${l:++$l} "$f" ;;
#   *)         xdg-open "$1" ;;
# esac
# '''
#
# Select a directory name in `ls` output and press C to cd into it.
# [[selection_commands]]
# key = "C"
# description = "cd into the selection"      # optional, ignored at runtime
# input = "cd %q\n"
#
# Type the selection into the shell without running it, ready to edit.
# [[selection_commands]]
# key = "Ctrl+Alt+V"
# input = "%"
#
# Edit the selection in vim, then run the edited text as a command in $SHELL.
# Opens a veter window (vim needs a terminal); on save & quit the edited
# command runs there, and the window closes when it finishes. $VETER_EXE is
# the running veter binary (so it works regardless of PATH). Needs vim.
# [[selection_commands]]
# key = "e"
# description = "edit in vim, then run"      # optional, ignored at runtime
# command = 'export VETER_EDIT=$(mktemp); printf "%s" "$VETER_SELECTION" > "$VETER_EDIT"; "${VETER_EXE:-veter}" -e "$SHELL" -c "vim \"\$VETER_EDIT\" && \"\$SHELL\" \"\$VETER_EDIT\""; rm -f "$VETER_EDIT"'
