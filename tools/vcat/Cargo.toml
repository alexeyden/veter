[package]
name = "vcat"
version = "0.1.0"
edition = "2024"
description = "Display images in a VGE-aware terminal."

[dependencies]
vge-protocol = { path = "../../protocol/vge" }
vge-render = { path = "../../libs/vge-render" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
