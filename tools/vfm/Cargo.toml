[package]
name = "vfm"
version = "0.1.0"
edition = "2024"
description = "File browser with thumbnail previews for VGE-aware terminals — ranger-style navigation, Dolphin-style icon grid."

[features]
default = ["system-clipboard"]
# Copy files (not just their paths) to the real system clipboard, as a
# `text/uri-list` selection. Needs a reachable display server, so a build
# destined for a headless or remote host can drop it and the dependency
# on arboard with it — `src/clip.rs` then takes the OSC 52 text route,
# which is all a remote vfm could use anyway.
system-clipboard = ["dep:arboard"]

[dependencies]
vge-protocol = { path = "../../protocol/vge" }
vge-render = { path = "../../libs/vge-render" }
vge-ui = { path = "../../libs/vge-ui" }
prt-protocol = { path = "../../protocol/prt" }
anyhow = "1"
# Same trim as veter's: `image-data` would pull an image stack we have
# no use for — vfm only ever sets a file list.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
], optional = true }
nix = { version = "0.29", features = ["term", "poll", "signal"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
