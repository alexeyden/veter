[package]
name = "vproto"
version = "0.1.0"
edition = "2024"
description = "Speak veter's protocols from a script: JSON commands in, JSON responses out."

[dependencies]
vge-protocol = { path = "../../protocol/vge", features = ["schemars"] }
prt-protocol = { path = "../../protocol/prt", features = ["schemars"] }
ses-protocol = { path = "../../protocol/ses", features = ["schemars"] }
vge-render = { path = "../../libs/vge-render" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Image handling for `UploadImageFile` / `measure`: decode any format the
# caller has on disk, resize to the target cell footprint, hand the
# result to vge-render's encoder.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif", "bmp"] }
base64 = "0.22"

[dev-dependencies]
# The placement tests drive the `vplace` script against a real pty and
# replay what it wrote through the real host engine, so the seam being
# tested (a client names a string; the terminal resolves it to a line)
# is exercised on both sides.
veter-host = { path = "../../libs/veter-host" }
vt100 = { path = "../../vendored/vt100" }
